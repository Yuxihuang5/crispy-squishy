grab}.canvas-area:active{cursor:grabbing}canvas{display:block;width:100%;height:100%}.hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;letter-spacing:1.6px;font-weight:600;color:#6390a6;pointer-events:none}.progress{height:3px;width:156px;border-radius:8px;background:#fff9;overflow:hidden;margin-top:5px}.progress>div{height:100%;width:0;background:#53809a;transition:width .06s linear}.status{font-size:12px;font-weight:600;color:#54829c;margin-top:14px;min-height:18px;text-align:center}.actions{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:17px}.restart{cursor:pointer;background:#ffffff55;border:1px solid #ffffffbf;border-radius:30px;padding:11px 24px;color:#4c7790;font-size:12px;letter-spacing:1px;font-weight:600;transition:background .2s}.restart:hover{background:#fff9}.bottom{position:absolute;left:clamp(24px,5vw,70px);right:clamp(24px,5vw,70px);bottom:20px;display:flex;align-items:end;justify-content:space-between;pointer-events:none}.bottom span{display:block;color:#ffffffbd;font-size:9px;font-weight:700;letter-spacing:2px}.bottom strong{display:block;color:white;font-size:21px;font-weight:350;letter-spacing:1px;margin-top:4px}.mobilehint{display:none}@media(max-width:600px){.top{padding:18px 20px}.content{justify-content:flex-start;padding-top:34px;min-height:calc(100svh - 84px)}.canvas-area{margin-top:13px;height:44vh;min-height:300px}.bottom{bottom:15px}.title{font-size:42px}.hint{bottom:0}.status{margin-top:10px}.mobilehint{display:block}.desktop-hint{display:none}}@media(max-height:650px){.top{padding-top:14px;padding-bottom:12px}.content{padding-top:0}.canvas-area{height:43vh;min-height:255px}.bottom{position:relative;bottom:auto;padding:0 25px 18px;left:auto;right:auto}}

/* Minimal object-only composition: no on-screen copy or counters. */
.top{position:absolute;right:clamp(16px,3vw,38px);top:14px;left:auto;padding:0;z-index:4}
.top .toolbar{gap:9px}
.top-btn{background:#ffffff18;border-color:#ffffff80;color:#ffffffd9;font-size:18px}
.content{min-height:100svh;padding:0;justify-content:center}
.canvas-area{width:min(720px,97vw);height:min(720px,88svh);min-height:320px;margin:0}
.status,.actions,.bottom{display:none!important}
@media(max-width:600px){.top{padding:0;top:14px;right:14px}.content{min-height:100svh;padding:0;justify-content:center}.canvas-area{height:min(84svh,650px);min-height:300px;margin:0}}
@media(max-height:650px){.content{padding:0}.canvas-area{height:90svh;min-height:230px}}

/* Small visual-only object selector. */
.flavor-picker{position:absolute;z-index:5;bottom:clamp(22px,4.5vh,52px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:9px 15px;border-radius:50px;background:#ffffff32;border:1px solid #ffffff75;backdrop-filter:blur(16px);box-shadow:0 12px 40px #416f8315}
.flavor{width:58px;height:58px;border:1px solid transparent;background:#ffffff35;border-radius:50%;display:grid;place-items:center;cursor:pointer;transition:transform .2s,background .2s,box-shadow .2s;touch-action:manipulation}
.flavor:hover{transform:translateY(-3px);background:#ffffff90}.flavor.active{background:#ffffffc4;border-color:white;box-shadow:0 2px 13px #618ca34c;transform:translateY(-2px)}
.mini-cookie,.mini-donut,.mini-pop,.mini-apple,.mini-croissant,.mini-breadbag{position:relative;display:block;filter:drop-shadow(0 3px 2px #73544935)}
.mini-cookie{width:35px;height:31px;border-radius:50%;background:repeating-linear-gradient(76deg,transparent 0 11px,#71473d58 12px 13px,transparent 14px 18px),repeating-linear-gradient(-14deg,transparent 0 10px,#71473d58 11px 12px,transparent 13px 18px),#a87565;border:3px solid #825445}
.mini-donut{width:36px;height:35px;border-radius:50%;background:conic-gradient(#f6e17d 0 32%,#b8db9b 32% 54%,#f5b6c8 54% 85%,#fff3a7 85%);border:3px solid #f4d2a4}
.mini-donut:after{content:"";position:absolute;inset:11px;border-radius:50%;background:#e4e7e0;box-shadow:0 0 0 2px #cba882}
.mini-pop{width:27px;height:37px;border-radius:12px 12px 8px 8px;background:linear-gradient(154deg,transparent 0 31%,#89a9c0 32% 59%,transparent 60%),linear-gradient(90deg,#f7df70 0 44%,#eea9be 44% 100%);border:2px solid #f1e2b1;transform:rotate(-16deg)}
.mini-pop:after{content:"";position:absolute;bottom:-10px;left:10px;width:6px;height:10px;border-radius:0 0 3px 3px;background:#d6a874}
.mini-apple{width:34px;height:31px;margin-top:4px;border-radius:43% 43% 48% 48%;border:4px solid #ca6668;background:linear-gradient(130deg,#fffce5,#f7e9b7);box-shadow:inset 2px 2px 4px #c4966840}
.mini-apple:before{content:"";position:absolute;top:-10px;left:13px;width:5px;height:10px;border-radius:6px;background:#78513a;transform:rotate(17deg)}
.mini-apple:after{content:"";position:absolute;top:-11px;left:18px;width:15px;height:9px;border-radius:85% 0 80% 10%;background:linear-gradient(115deg,#9bd4a8,#588c76);transform:rotate(-20deg)}
.mini-croissant{width:40px;height:28px;border-radius:55% 44% 45% 55%;transform:rotate(-17deg);background:repeating-linear-gradient(106deg,transparent 0 6px,#d88b30 7px 10px,#ffe8a0 11px 14px,transparent 15px 19px),linear-gradient(150deg,#fbe39c,#ed9f38 65%,#b95f19);box-shadow:inset 2px 3px 3px #fff6cf,0 3px 1px #a95e24}
 .mini-breadbag{width:33px;height:37px;border:2px solid #e9edef;border-radius:5px;background:radial-gradient(circle at 35% 29%,#fff2ce 0 12%,#dc995c 26%,transparent 28%),radial-gradient(circle at 70% 53%,#fff2cf 0 12%,#d99454 26%,transparent 28%),radial-gradient(circle at 34% 77%,#fff2cf 0 12%,#d99454 26%,transparent 28%),rgba(255,255,255,.57);box-shadow:inset 0 0 2px #b2bfc6,0 2px 2px #b4a6a1}

/* Pastel polka-dot stage and one dimensional chocolate-brown display platter. */
body{background:#fff2bb}
.app{background-color:#fff2bb;background-image:radial-gradient(circle,#81a7d9 0 5px,transparent 5.7px);background-size:62px 62px;background-position:4px 9px}

.canvas-area{isolation:isolate}
.display-platter{position:absolute;z-index:0;left:50%;top:47.5%;width:520px;height:520px;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
 background:#ffffff;
 box-shadow:0 10px 0 #f3f3f3,0 18px 30px rgba(67,76,83,.14),inset 0 2px 6px rgba(255,255,255,.95),inset 0 -7px 12px rgba(0,0,0,.045)}
.display-platter:before{content:"";position:absolute;inset:2.5%;border-radius:50%;border:2px solid rgba(225,225,225,.35);box-shadow:inset 0 4px 12px rgba(0,0,0,.025);pointer-events:none}
.canvas-area canvas{position:relative;z-index:1}
.flavor-picker{background:#fff8dfdc;border:1px solid #ffffffde;box-shadow:0 9px 30px #6e532e22}
.flavor{background:#fff8e5bb}.flavor:hover{background:#fffdf2}.flavor.active{background:#fff;border-color:#e8cfa5;box-shadow:0 2px 12px #9f7c443c}

/* Updated thumbnails: match the user's chosen food photographs. */
.mini-cookie{background:repeating-linear-gradient(170deg,transparent 0 7px,#4d2924 8px 12px,transparent 13px 19px),linear-gradient(135deg,#dfad9f,#805044);border:3px solid #795040;border-radius:44%;box-shadow:inset 2px 3px 4px #f9d6bf,0 3px 2px #69382e}
.mini-donut{background:#8bc6ed;border:3px solid #d6a266;box-shadow:inset 3px 4px 4px #bde8ff,inset -2px -3px 3px #649dc9}
.mini-donut:after{background:#fff5dd;box-shadow:0 0 0 3px #c48e50}
.flavor[data-flavor="donut"] .mini-donut:before{content:"";position:absolute;inset:3px;border-radius:50%;background:radial-gradient(ellipse at 22% 24%,#fff 0 2px,transparent 3px),radial-gradient(ellipse at 74% 30%,#ffc1dc 0 2px,transparent 3px),radial-gradient(ellipse at 30% 76%,#f6e389 0 2px,transparent 3px),radial-gradient(ellipse at 80% 72%,#b3e9b0 0 2px,transparent 3px)}
.mini-pop{background:linear-gradient(180deg,#f5b3c9 0 44%,#ba94cf 45% 100%);border:2px solid #d69dc2;box-shadow:inset 3px 2px 3px #ffdfeb,inset -2px -2px 3px #9774b7;transform:rotate(-10deg)}
.mini-pop:after{background:#d3a073}

.mini-bagels{position:relative;width:32px;height:39px;display:block;border-radius:7px 7px 5px 5px;background:repeating-linear-gradient(to bottom,#e3a65d 0 5px,#f8db9f 6px 9px,#b47b49 10px 11px);border:2px solid #e3e9e9;box-shadow:inset 2px 0 2px #ffffffb0,inset -2px 0 2px #ffffff88}
.mini-bagels:before{content:"";position:absolute;left:9px;top:-8px;width:11px;height:8px;background:#ffffffa8;clip-path:polygon(0 0,100% 0,75% 100%,24% 100%);border-top:2px solid #bdd6dc}
.mini-bagels:after{content:"";position:absolute;left:5px;top:13px;width:20px;height:10px;border-radius:2px;background:linear-gradient(#c9b9a1 0 48%,#a9cee0 49%);box-shadow:0 0 0 .5px #ffffffa8}

.mini-melonbread{display:block;width:35px;height:31px;border-radius:48% 48% 44% 44%;background:repeating-linear-gradient(28deg,transparent 0 8px,#f4d49c 9px 11px,transparent 12px 17px),repeating-linear-gradient(-30deg,transparent 0 8px,#ffdd9e 9px 11px,transparent 12px 17px),radial-gradient(circle at 33% 27%,#fff0c1,#f0ae5f 70%,#be7c37);border:1px solid #eaba78;box-shadow:0 2px 4px #b8793b36}

/* Selector-only refinement: smaller, precisely centered popsicle thumbnail. */
.flavor[data-flavor="popsicle"]{display:flex;align-items:center;justify-content:center}
.flavor[data-flavor="popsicle"] .mini-pop{width:23px;height:31px;margin:0 0 5px;transform:rotate(-10deg);transform-origin:center center;flex:none}

@media(max-width:600px){.flavor[data-flavor="popsicle"] .mini-pop{width:21px;height:29px;margin-bottom:5px}}
/* Seventh object: rounded fried-egg squishy thumbnail. */
.mini-egg{display:block;width:35px;height:32px;position:relative;border-radius:53% 47% 52% 45% / 48% 57% 42% 55%;transform:rotate(-13deg);background:radial-gradient(ellipse at 34% 24%,#fff,#f2f2e8 62%,#d2d6d0 100%);box-shadow:inset -3px -3px 5px #b7bbaf66,0 3px 4px #74643c27}
.mini-egg:after{content:"";position:absolute;width:17px;height:17px;top:7px;left:9px;border-radius:50%;background:radial-gradient(circle at 32% 25%,#ffe3bd 0%,#efb77a 40%,#ce8957 80%,#b47c58 100%);box-shadow:inset -2px -3px 4px #a76f4644,1px 2px 3px #a8897744}
.flavor-picker{max-width:calc(100vw - 18px);gap:clamp(4px,1.3vw,14px);padding:8px clamp(7px,1.3vw,15px)}
@media(max-width:600px){.flavor{width:clamp(39px,11.8vw,51px);height:clamp(39px,11.8vw,51px)}.flavor-picker{gap:clamp(3px,.75vw,9px);padding:7px}}

.canvas-area canvas{z-index:2}
@media(max-width:600px){.lace-doily{width:106vw}}

/* Croissant selector: curved, layered pastry thumbnail only. */
.flavor[data-flavor="croissant"] .croissant-icon{display:block;width:44px;height:37px;object-fit:contain;filter:none;pointer-events:none}
@media(max-width:600px){.flavor[data-flavor="croissant"] .croissant-icon{width:38px;height:33px}}

/* Responsive portrait composition: on phones the interactive stage is 3:4,
   fitted inside the visible screen together with all seven selectors.
   Desktop retains its original full-screen layout. */
@media (max-width: 700px) and (orientation: portrait) {
  html, body { width:100%; min-height:100%; margin:0; overflow-x:hidden; }
  .app { width:100%; height:100svh; min-height:100svh; overflow:hidden; }
  .content {
    width:100%; height:100svh; min-height:100svh;
    box-sizing:border-box;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    padding:49px 0 83px;
  }
  .canvas-area {
    flex:0 0 auto; margin:0; min-height:0 !important;
    width:min(calc(100vw - 8px), calc((100svh - 144px) * .75));
    height:auto !important; aspect-ratio:3 / 4;
    max-height:calc(100svh - 144px);
    overflow:visible;
  }
  .canvas-area canvas { width:100%; height:100%; }
  /* Mobile: preserve a perfect circular doily, centered below the round plate.
     Width is relative to the stage; aspect-ratio forces the same pixel height. */
  .lace-doily {
    width:106%;
    height:auto;
    aspect-ratio:1 / 1;
    max-width:none;
    top:47.5%;
    background-size:contain;
    background-repeat:no-repeat;
  }
  .top { position:absolute; top:max(10px, env(safe-area-inset-top)); right:12px; left:auto; padding:0; }
  .top-btn { width:35px; height:35px; font-size:17px; }
  .flavor-picker {
    position:absolute;
    left:50%; bottom:max(clamp(34px, 8svh, 88px), env(safe-area-inset-bottom));
    max-width:calc(100vw - 10px); width:max-content;
    flex-wrap:nowrap; white-space:nowrap;
    gap:clamp(3px, .85vw, 7px); padding:6px 8px;
    box-sizing:border-box; transform:translateX(-50%);
  }
  .flavor { width:clamp(35px, 10.7vw, 46px);height:clamp(35px, 10.7vw, 46px);min-width:0;flex:0 0 auto; }
  .flavor[data-flavor="croissant"] .croissant-icon { width:34px; height:27px; }
  .flavor[data-flavor="popsicle"] .mini-pop { width:19px; height:27px; margin-bottom:4px; }
  .flavor[data-flavor="popsicle"] .mini-pop:after { height:7px; bottom:-7px; }
}
@media (max-width:700px) and (orientation:landscape) {
  /* Short screens still keep the selector on screen and the stage unobstructed. */
  .app, .content { min-height:100svh; }
  .canvas-area { width:min(70vh, 65vw); height:min(89svh, 640px); min-height:0!important; }
  .flavor-picker { bottom:8px; }
}


.dot-clear-toolbar{
 position:absolute;top:0;right:0;width:116px;height:68px;
 background:#fff2bb;z-index:3;pointer-events:none;
}
@media (max-width:700px){.dot-clear-toolbar{width:100px;height:58px}}

/* Larger music/reset controls; existing button handlers are unchanged. */
.top-btn{width:52px;height:52px;font-size:24px;line-height:1;flex-shrink:0}
.toolbar{gap:12px}
.dot-clear-toolbar{width:138px;height:75px}
@media(max-width:700px){
 .top-btn{width:48px;height:48px;font-size:23px}
 .toolbar{gap:9px}
 .dot-clear-toolbar{width:114px;height:66px}
}

/* November 2026: compact desktop platter and inset phone stage.
   Keep the stage's 3:4 mobile aspect and its original touch coordinate system. */
@media (min-width: 701px) {
  .canvas-area {
    width:min(560px, 72vw, 76svh);
    height:min(560px, 72vw, 76svh);
    min-height:0;
  }
  .lace-doily { width:min(540px, 75vw, 78svh); }
}
@media (max-width: 700px) and (orientation: portrait) {
  .canvas-area {
    width:min(calc(100vw - 40px), calc((100svh - 144px) * .75));
    max-height:calc(100svh - 144px);
  }
  .lace-doily { width:106%; height:auto; aspect-ratio:1 / 1; }
}

/* Desktop-only: make the seven-item selector more compact without changing mobile layout. */
@media (min-width: 701px) {
  .flavor-picker {
    gap: 8px;
    padding: 7px 11px;
    border-radius: 44px;
  }
  .flavor {
    width: 45px;
    height: 45px;
  }
  .flavor > * {
    transform-origin: center center;
  }
  .flavor .mini-apple,
  .flavor .mini-egg,
  .flavor .mini-donut,
  .flavor .mini-pop,
  .flavor .mini-breadbag,
  .flavor .mini-bagels,
  .flavor .mini-melonbread,
  .flavor .mini-cookie,
  .flavor .mini-croissant {
    scale: .82;
  }
  .flavor[data-flavor="croissant"] .croissant-icon {
    width: 35px;
    height: 29px;
  }
}
</style>

function vEggInside(x,y){
 let inside=false;
 for(let i=0,j=vEggOutline.length-1;i<vEggOutline.length;j=i++){
  const a=vEggOutline[i],b=vEggOutline[j];
  if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])inside=!inside;
 }
 return inside;
}
function vEggDomePath(c,x=.055,y=.045,rx=.405,ry=.405){
 c.beginPath();for(let i=0;i<=100;i++){
  const a=i/100*Math.PI*2;const p=vDeformPoint(x+rx*Math.cos(a),y+ry*Math.sin(a));
  if(i)c.lineTo(p.x,p.y);else c.moveTo(p.x,p.y);
 }c.closePath();
}

   bodyCtx.restore();
  }
  ctx.save();
  cDrawElasticBody(ctx,body.can,now);
  ctx.restore();
 }
 // Shards retain their true size and material. Bagged rolls trap them in the packet.
 ctx.save();if(isBagged()){ctx.save();if(productMode==='bagelbag'){ctx.translate(0,-.035);ctx.scale(1.18,1.18)}cBagPath(ctx);ctx.restore();ctx.clip()}else{ctx.beginPath();ctx.arc(0,0,porcelainRadius()/r+.008,0,TAU);ctx.clip()}
 for(const f of cPieces){if(now<f.t)continue;let t=clamp((now-f.t)/f.duration,0,1);
  let ease=1-Math.pow(1-t,3),x=f.x+(f.lx-f.x)*ease,y=f.y+(f.ly-f.y)*ease;
  if(!isBagged()){
   const safe=seatShardOnPlate(x,y,f.image,f.cell,r,o.x,o.y);
   x=safe.x;y=safe.y;
  }
  ctx.save();ctx.translate(x,y);ctx.rotate(f.turn*ease);ctx.translate(-f.cell.x,-f.cell.y);
  let a=f.image;ctx.shadowColor=productMode==='bagelbag'?'rgba(0,0,0,0)':'rgba(118,77,28,.11)';ctx.shadowBlur=productMode==='bagelbag'?0:.009;ctx.shadowOffsetY=productMode==='bagelbag'?0:.004;
  ctx.drawImage(a.img,a.minX,a.minY,a.w,a.h);ctx.restore();
 }
 ctx.restore();if(isBagged())cDrawBagFront(ctx);ctx.restore();
}
function cTap(p,now){
 if(!cAlpha(p.x,p.y))return;
 cCount++;cPresses=cPresses.filter(press=>now-press.t<500);cPresses.push({x:p.x,y:p.y,t:now,dx:0,dy:0,strength:.8,drag:false});if(cPresses.length>48)cPresses.shift();
 const hits=cCells.filter(c=>!c.removed&&Math.hypot(c.x-p.x,c.y-p.y)<(productMode==='bagelbag'?.27:.53)).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y));
 hits.forEach(c=>c.cracked=true);
 // Only existing visible shell polygons. Modest, varied batch; no respawn.
 const count=Math.min(hits.length,productMode==='bagelbag'?3+Math.floor(Math.random()*2):2+Math.floor(Math.random()*2));
 if(['bagelbag','croissant','breadbag'].includes(productMode)) playCrunch();
 else if(count===0) playCrunch();
 for(const [chipIndex,cell] of hits.slice(0,count).entries()){
  if(!['bagelbag','croissant','breadbag'].includes(productMode)) setTimeout(()=>{if(soundOn)playCrunch();},chipIndex*65);
  cell.removed=true;const a=cChipSnapshot(cell),idx=cPieces.length;
  // The sealed packet keeps shards inside; the lone croissant drops on the white plate.
  let lx=isBagged()?clamp(cell.x*.58+vRng(-.21,.21),productMode==='bagelbag'?-.65:-.97,productMode==='bagelbag'?.65:.97):Math.cos(Math.atan2(p.y,p.x)+vRng(-.24,.24))*vRng(1.12,1.35);
  let ly=isBagged()?(productMode==='bagelbag'?.53:.67)+vRng(-.055,productMode==='bagelbag'?.08:.30):Math.sin(Math.atan2(p.y,p.x)+vRng(-.24,.24))*vRng(1.12,1.35);
  for(let attempt=0;attempt<14;attempt++){
   if(cPieces.every(f=>Math.hypot(f.lx-lx,f.ly-ly)>.105))break;
   if(isBagged()){lx=clamp(lx+vRng(-.18,.18),productMode==='bagelbag'?-.66:-.99,productMode==='bagelbag'?.66:.99);ly=(productMode==='bagelbag'?.54:.65)+vRng(-.05,productMode==='bagelbag'?.07:.33)}else{const a=Math.atan2(ly,lx)+vRng(-.35,.35),r=vRng(1.12,1.34);lx=Math.cos(a)*r;ly=Math.sin(a)*r}
  }
  cPieces.push({cell,image:a,x:cell.x,y:cell.y,lx,ly,turn:vRng(-.22,.22),t:now+vRng(0,42),duration:vRng(280,435)});
 }
}

function switchProduct(mode){productMode=mode;CBOUNDS=mode==='bagelbag'?{x:-1.13,y:-.88,w:2.26,h:1.73}:{x:-1.08,y:-.71,w:2.16,h:1.53};cClayCache=null;cClayMode='';document.querySelectorAll('[data-flavor]').forEach(b=>{const active=b.dataset.flavor===mode;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});
 area.setAttribute('aria-label',mode==='egg'?'按压3D荷包蛋脆皮':mode==='donut'?'点击彩虹甜甜圈外壳':mode==='popsicle'?'点击彩虹雪糕外壳':mode==='apple'?'点击苹果脆皮':mode==='croissant'?'点击牛角面包脆皮':mode==='breadbag'?'点击袋装面包脆皮':mode==='bagelbag'?'揉捏包装袋里的蜜瓜包脆皮':'点击脆皮捏捏');
 reset();}
document.querySelectorAll('[data-flavor]').forEach(b=>b.addEventListener('click',()=>switchProduct(b.dataset.flavor)));

area.addEventListener('pointerdown',startGesture);
area.addEventListener('pointermove',moveGesture);
area.addEventListener('pointerup',endGesture);
area.addEventListener('pointercancel',endGesture);
area.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!e.repeat){e.preventDefault();if(isBakery())cTap({x:0,y:-.25},performance.now());else vTap({x:0,y:-.25},performance.now())}});
function reset(){if(isBakery()){cInit();return;}if(productMode!=='chocolate'){vSeedSprinkles();vInit();return;}doughOffsetX=0;doughOffsetY=0;clayContour=null;fallenShellPieces=[];embeddedCocoaFlecks=[];clayPressEvents=[];fusionFrom=0;fusionTo=0;fusionStart=performance.now();softMarks=[];softGesture=null;clayStretches=[];activeClay=null;gesture=null;fractured=false;clusters=[];crunchCount=0;collapseStart=0;collapsePieces=[];collapseBase=null;collapseDone=false;impactStart=0;bursts=[];dents=[];links=[];overallGrowth=1;counter.textContent='000';status.textContent='点击脆壳逐渐揉碎 · 大约 12 次揉捏后完全融合';render(performance.now())}
document.getElementById('reset').addEventListener('click',reset);document.getElementById('resetTop').addEventListener('click',reset);
document.getElementById('sound').addEventListener('click',e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'♫':'♪';e.currentTarget.style.opacity=soundOn?'1':'.45'});
window.addEventListener('resize',resize);resize();reset();raf=requestAnimationFrame(loop);
})();
